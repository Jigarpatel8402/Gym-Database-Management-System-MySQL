
{% extends "layout.html" %}
{% block content %}
<h3>Feedback</h3>
<form method="POST">
  <select name="member_id" class="form-control mb-2">{% for m in members %}<option value="{{ m.member_id }}">{{ m.name }}</option>{% endfor %}</select>
  <select name="trainer_id" class="form-control mb-2">{% for t in trainers %}<option value="{{ t.trainer_id }}">{{ t.name }}</option>{% endfor %}</select>
  <input class="form-control mb-2" name="rating" placeholder="Rating (1-5)">
  <textarea class="form-control mb-2" name="comments" placeholder="Comments"></textarea>
  <input class="form-control mb-2" name="date" placeholder="Date (mm/dd/yyyy)" type="text" onfocus="this.type='date'" onblur="if(!this.value) this.type='text'">
  <button class="btn btn-primary">Submit</button>
</form>
{% endblock %}
